<!DOCTYPE html>
<html>

<head>
    <title>Bidders</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <div class="navbar">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('agencies') }}">Agencies</a>
        <a href="{{ url_for('bidders') }}">Bidders</a>
        <a href="{{ url_for('tenders') }}">Tenders</a>
        <a href="{{ url_for('bids') }}">Bids</a>
    </div>

    <h2 class="page-title">Bidder Management</h2>

    <div class="card">

        <table>

            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Company</th>
                <th>Address</th>
                <th>Actions</th>
            </tr>

            {% for row in rows %}

            <tr>

                <td>{{ row.bidder_id }}</td>
                <td>{{ row.bidder_name }}</td>
                <td>{{ row.email }}</td>
                <td>{{ row.phone }}</td>
                <td>{{ row.company_name }}</td>
                <td>{{ row.address }}</td>

                <td>

                    <a class="edit-btn"
                       href="{{ url_for('edit_bidder', bidder_id=row.bidder_id) }}">
                        Edit
                    </a>

                    <form action="{{ url_for('delete_bidder', bidder_id=row.bidder_id) }}"
                          method="POST"
                          style="display:inline;">

                        <button class="delete-btn"
                                type="submit">
                            Delete
                        </button>

                    </form>

                </td>

            </tr>

            {% endfor %}

        </table>

    </div>

    <div class="card">

        <h2>Add New Bidder</h2>

        <form action="{{ url_for('add_bidder') }}"
              method="POST">

    <div class="form-container">

        <label>Bidder Name</label>
        <input type="text"
               name="bidder_name"
               required>

        <label>Email</label>
        <input type="email"
               name="email"
               required>

        <label>Phone</label>
        <input type="text"
               name="phone"
               required>

        <label>Company Name</label>
        <input type="text"
               name="company_name"
               required>

        <label>Address</label>
        <textarea name="address"
                  required></textarea>

        <button type="submit">
            Add Bidder
        </button>

    </div>

</form>

    </div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
